<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Te has quedado sin pelotas · Obsoletus y la Gran Oca del Saber</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101629;color:#f4f1e8;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:grid;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto auto;
  grid-template-areas:"barra barra barra" "escena escena escena" "herr herr herr" "cruceta . acciones"}
#barra{grid-area:barra;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
#titulo{margin:0;font-size:clamp(15px,2.6vw,24px);letter-spacing:.06em;text-transform:uppercase;color:#F1C453;
  text-shadow:2px 2px 0 #6D42C7;line-height:1.1;flex:1 1 220px}
#hud{display:flex;flex-wrap:wrap;gap:4px;font-size:13px}
.chip{background:#1b2444;border:2px solid #6D42C7;padding:2px 7px;white-space:nowrap}
.chip b{color:#42D6A4;font-weight:700;margin-right:4px}
#botones{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:#f4f1e8;background:#1b2444;border:2px solid #6D42C7;padding:6px 10px;cursor:pointer;
  border-radius:0;touch-action:manipulation;min-height:36px;box-shadow:2px 2px 0 #000}
button:hover{background:#2a3566}
button:focus-visible,textarea:focus-visible{outline:3px solid #F1C453;outline-offset:2px}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
button[disabled]{opacity:.45;cursor:not-allowed}
button[aria-pressed="true"]{background:#6D42C7;border-color:#F1C453}
#botones button{font-size:12px;padding:4px 8px}
#escena{grid-area:escena;position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#lienzo{display:block;background:#101629;border:3px solid #6D42C7;image-rendering:pixelated;touch-action:none}
#avisos{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;padding:0 8px}
.aviso{background:#101629ee;border:2px solid #42D6A4;color:#f4f1e8;padding:5px 10px;font-size:14px;line-height:1.3;max-width:560px;text-align:center}
#herramientas{grid-area:herr;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#herramientas:empty{display:none}
#herramientas button{flex:1 1 130px;max-width:230px;font-size:13px;line-height:1.2;min-height:44px;padding:4px 6px}
#herramientas button[aria-pressed="true"]::before{content:"\25B6 "}
#cruceta{grid-area:cruceta;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:3px}
#acciones{grid-area:acciones;display:flex;gap:8px;align-items:center}
#cruceta button,#acciones button{touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;padding:0}
#acciones button{min-width:76px;height:76px;font-size:14px;border-radius:0;padding:4px}
#cruceta:empty,#acciones:empty{display:none}
.pulsado{background:#6D42C7!important}
@media (hover:hover) and (pointer:fine) and (min-width:900px){#cruceta,#acciones{display:none}}
@media (orientation:landscape) and (max-height:560px){
  #app{grid-template-rows:auto 1fr auto;grid-template-areas:"barra barra barra" "cruceta escena acciones" "herr herr herr"}
  #cruceta,#acciones{align-self:end}
  #acciones{flex-direction:column}
  #acciones button{height:56px}
  #titulo{font-size:14px;flex:0 1 auto}
  #herramientas button{min-height:36px}
}
@media (max-width:520px){#botones{width:100%}#botones button{flex:1;padding:4px 2px}#hud{font-size:12px}}
#capa{position:fixed;inset:0;background:#080b16d9;display:flex;align-items:center;justify-content:center;padding:10px;z-index:10}
#capa[hidden]{display:none}
#panel{background:#1b2444;border:3px solid #6D42C7;box-shadow:6px 6px 0 #000;max-width:660px;width:100%;max-height:100%;
  overflow:auto;padding:16px 18px;font-size:15px;line-height:1.45;outline:none}
#panel h2{margin:0 0 8px;color:#F1C453;font-size:clamp(18px,4vw,26px);text-transform:uppercase;letter-spacing:.05em;text-shadow:2px 2px 0 #6D42C7}
#panel h3{margin:14px 0 4px;color:#42D6A4;font-size:15px;text-transform:uppercase}
#panel p{margin:6px 0}
#panel ol,#panel ul{margin:6px 0;padding-left:22px}
#panel .opciones{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#panel .opciones.fila{flex-direction:row;flex-wrap:wrap}
#panel .opciones.fila button{flex:1;min-width:48px;text-align:center}
#panel .opciones button{text-align:left;min-height:44px;font-size:15px}
#panel .opciones button small{display:block;color:#c9cfe8;font-size:13px;margin-top:2px}
#panel .principal{background:#6D42C7;border-color:#F1C453;font-weight:700;font-size:17px;min-height:48px;text-align:center}
#panel textarea{width:100%;font:inherit;font-size:16px;background:#101629;color:#f4f1e8;border:2px solid #42D6A4;padding:8px;min-height:74px;resize:vertical;border-radius:0}
#panel label{display:block;margin:10px 0 4px;color:#42D6A4}
#panel .nota{font-size:13px;color:#c9cfe8}
#panel .ficha{background:#101629;border:2px dashed #F1C453;padding:10px;white-space:pre-wrap;word-break:break-word;
  user-select:text;-webkit-user-select:text;font-size:14px;margin:8px 0}
#panel .conmutadores{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.barras{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;margin:8px 0}
.barras .b{height:18px;background:repeating-linear-gradient(90deg,#42D6A4 0 8px,#2fae84 8px 10px);border:2px solid #f4f1e8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="app">
  <header id="barra">
    <h1 id="titulo"></h1>
    <div id="hud"></div>
    <div id="botones">
      <button type="button" id="bPausa">Pausa</button>
      <button type="button" id="bReiniciar">Reiniciar</button>
      <button type="button" id="bSonido" aria-pressed="false">Sonido: no</button>
      <button type="button" id="bTranquilo" aria-pressed="false">Tranquilo: no</button>
    </div>
  </header>
  <main id="escena"><canvas id="lienzo" aria-label="Zona de juego"></canvas><div id="avisos" aria-live="polite"></div></main>
  <div id="herramientas"></div>
  <div id="cruceta"></div>
  <div id="acciones"></div>
  <div id="capa" hidden><div id="panel" role="dialog" aria-modal="true" tabindex="-1"></div></div>
</div>
<script>
/* Motor común de las recreativas de «Obsoletus y la Gran Oca del Saber».
   Sin dependencias externas ni almacenamiento: todo vive en memoria durante la sesión. */
(function () {
  'use strict';
  var C = { noche: '#101629', noche2: '#1b2444', morado: '#6D42C7', morado2: '#a98bf0', menta: '#42D6A4',
    oro: '#F1C453', blanco: '#f4f1e8', rojo: '#ff8a8a', gris: '#8791b5' };
  var FUENTE = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace';
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  /* ---------- Ayudas de dibujo ---------- */
  function texto(ctx, s, x, y, o) {
    o = o || {};
    var tam = o.tam || 14;
    ctx.font = (o.negrita ? '700 ' : '') + tam + 'px ' + FUENTE;
    ctx.textAlign = o.alin || 'center';
    ctx.textBaseline = o.base || 'middle';
    var lineas = [String(s)];
    if (o.ancho) {
      lineas = [];
      var pal = String(s).split(' '), l = '';
      pal.forEach(function (p) {
        var t = l ? l + ' ' + p : p;
        if (ctx.measureText(t).width > o.ancho && l) { lineas.push(l); l = p; } else l = t;
      });
      lineas.push(l);
    }
    var alto = tam * 1.25, y0 = y - (lineas.length - 1) * alto / 2;
    lineas.forEach(function (ln, i) {
      if (o.sombra !== false) { ctx.fillStyle = o.sombraColor || '#000'; ctx.fillText(ln, x + 1, y0 + i * alto + 1); }
      ctx.fillStyle = o.color || C.blanco;
      ctx.fillText(ln, x, y0 + i * alto);
    });
    return lineas.length;
  }
  function caja(ctx, x, y, w, h, relleno, borde, grosor) {
    if (relleno) { ctx.fillStyle = relleno; ctx.fillRect(x, y, w, h); }
    if (borde) { ctx.strokeStyle = borde; ctx.lineWidth = grosor || 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2); }
  }
  /* Oca exploradora: centrada en (x,y), altura aproximada t. o = {dir:-1|1, paso:bool, color:gorro} */
  function oca(ctx, x, y, t, o) {
    o = o || {};
    var u = t / 9;
    ctx.save(); ctx.translate(x, y); ctx.scale(o.dir < 0 ? -1 : 1, 1);
    function r(c, a, b, w, h) { ctx.fillStyle = c; ctx.fillRect(a * u, b * u, w * u, h * u); }
    r('#f4f1e8', -3.5, -0.5, 5.5, 3.5);
    r('#d9d4c4', -3, 0.3, 3, 1.6);
    r('#f4f1e8', 0.8, -3.5, 2, 4);
    r(o.color || C.menta, 0.3, -4.5, 3, 1);
    r('#101629', 1.9, -2.8, 0.7, 0.7);
    r(C.oro, 2.8, -2.4, 1.6, 0.9);
    var p = o.paso ? 0.8 : 0;
    r(C.oro, -2 + p, 3, 1, 1.4); r(C.oro, 0 - p, 3, 1, 1.4);
    ctx.restore();
  }
  /* Robot de Obsoletus: centrado en (x,y), altura aproximada t. o = {color, ojo, enfado} */
  function robot(ctx, x, y, t, o) {
    o = o || {};
    var u = t / 9;
    ctx.save(); ctx.translate(x, y);
    function r(c, a, b, w, h) { ctx.fillStyle = c; ctx.fillRect(a * u, b * u, w * u, h * u); }
    r(C.gris, -0.3, -4.5, 0.6, 1.2); r(o.ojo || C.rojo, -0.7, -5, 1.4, 0.8);
    r(C.blanco, -3.8, -3.6, 7.6, 5.9); r(o.color || '#3b2a78', -3.5, -3.3, 7, 5.3);
    r('#000', -2.6, -2.2, 5.2, 1.8);
    r(o.ojo || C.rojo, -2, -1.8, 1.2, 1); r(o.ojo || C.rojo, 0.8, -1.8, 1.2, 1);
    r('#000', -2, 0.6, 4, 0.6);
    r(C.gris, -2.8, 2, 2, 2.4); r(C.gris, 0.8, 2, 2, 2.4);
    ctx.restore();
  }
  function pluma(ctx, x, y, t, color) {
    var u = t / 8;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
    ctx.fillStyle = color || C.oro;
    ctx.fillRect(-1.5 * u, -4 * u, 3 * u, 6 * u); ctx.fillRect(-0.8 * u, -5 * u, 1.6 * u, 1 * u);
    ctx.fillStyle = '#000'; ctx.fillRect(-0.2 * u, -3.5 * u, 0.4 * u, 7.5 * u);
    ctx.restore();
  }
  function choca(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function limitar(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- Motor ---------- */
  function crear(J) {
    var lienzo = $('lienzo'), ctx = lienzo.getContext('2d'), capa = $('capa'), panel = $('panel');
    var W = J.ancho || 480, H = J.alto || 360, k = 1;
    var estado = 'inicio', gen = 0, tranquilo = false, sonido = false, audio = null;
    var registro = [], hudCache = '', herr = null, herrSel = null, alHerr = null;
    var cola = Promise.resolve(), botonesModal = null, flotantes = [];
    var ctl = J.controles || {};
    var dirs = ctl.cruceta || ['arriba', 'abajo', 'izq', 'der'];
    var acciones = ctl.acciones || [];
    var teclas = { arriba: false, abajo: false, izq: false, der: false };
    var TECLAS_DEF = [[' '], ['x', 'm'], ['z', 'n']];
    var mapa = { arrowup: 'arriba', w: 'arriba', arrowdown: 'abajo', s: 'abajo', arrowleft: 'izq', a: 'izq', arrowright: 'der', d: 'der' };
    acciones.forEach(function (a, i) {
      teclas[a.id] = false;
      (a.teclas || TECLAS_DEF[i] || []).forEach(function (t) { mapa[t.toLowerCase()] = a.id; });
    });

    var api = {
      W: W, H: H, C: C, t: 0, teclas: teclas,
      get tranquilo() { return tranquilo; },
      get vel() { return tranquilo ? 0.6 : 1; },
      get herramienta() { return herrSel; },
      get jugando() { return estado === 'jugando'; },
      hud: function (o) {
        var h = '';
        Object.keys(o).forEach(function (kk) {
          if (o[kk] == null || o[kk] === '') return;
          h += '<span class="chip"><b>' + esc(kk) + '</b>' + esc(o[kk]) + '</span>';
        });
        if (h !== hudCache) { hudCache = h; $('hud').innerHTML = h; }
      },
      sonido: bip,
      mensaje: function (txt, ms) {
        var cont = $('avisos'), a = el('div', 'aviso', txt);
        while (cont.children.length >= 2) cont.removeChild(cont.firstChild);
        cont.appendChild(a);
        setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, ms || 3200);
      },
      flotar: function (txt, x, y, o) {
        o = o || {};
        flotantes.push({ txt: txt, x: x, y: y, v: 0, dur: o.dur || 1.1, color: o.color || C.oro, tam: o.tam || 13 });
        if (flotantes.length > 8) flotantes.shift();
      },
      registrar: function (txt) { registro.push(String(txt)); },
      elegir: function (cfg) {
        var g = gen;
        cola = cola.then(function () { return g === gen ? modal(cfg, g) : new Promise(function () {}); });
        return cola;
      },
      informar: function (cfg) {
        return api.elegir({ titulo: cfg.titulo, texto: cfg.texto, html: cfg.html, opciones: [cfg.boton || 'Continuar'] });
      },
      herramientas: function (lista, alElegir) {
        herr = lista && lista.length ? lista : null; alHerr = alElegir || null;
        herrSel = null; pintarHerr(); ajustar();
      },
      seleccionar: function (id) { elegirHerr(id, true); },
      ayuda: function (html) { J.ayuda = html; },
      terminar: fin
    };

    /* --- Sonido (apagado por defecto) --- */
    function bip(tipo) {
      if (!sonido) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        var f = { punto: 880, ok: 660, error: 200, golpe: 150, salto: 520, disparo: 740, gana: 990 }[tipo] || 440;
        var o = audio.createOscillator(), gn = audio.createGain();
        o.type = 'square'; o.frequency.value = f; gn.gain.value = 0.05;
        o.connect(gn); gn.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + 0.09);
      } catch (e) { /* sin audio disponible */ }
    }

    /* --- Tamaño del lienzo --- */
    function ajustar() {
      var r = $('escena').getBoundingClientRect();
      var s = Math.max(0.2, Math.min((r.width - 6) / W, (r.height - 6) / H));
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      lienzo.style.width = Math.floor(W * s) + 'px';
      lienzo.style.height = Math.floor(H * s) + 'px';
      lienzo.width = Math.round(W * s * dpr); lienzo.height = Math.round(H * s * dpr);
      k = lienzo.width / W;
    }
    window.addEventListener('resize', ajustar);
    if (window.ResizeObserver) new ResizeObserver(ajustar).observe($('escena'));

    /* --- Entrada --- */
    function soltar() { Object.keys(teclas).forEach(function (t) { teclas[t] = false; }); }
    function pulsar(id) {
      if (estado !== 'jugando') return;
      if (id in teclas) teclas[id] = true;
      if (J.alPulsar) J.alPulsar(id, api);
    }
    function escribiendo(e) { var t = e.target && e.target.tagName; return t === 'TEXTAREA' || t === 'INPUT'; }
    window.addEventListener('keydown', function (e) {
      if (escribiendo(e) || e.ctrlKey || e.metaKey || e.altKey) return;
      var key = e.key.toLowerCase();
      if (estado === 'modal') {
        var n = parseInt(key, 10);
        if (botonesModal && n >= 1 && n <= botonesModal.length) { e.preventDefault(); botonesModal[n - 1].click(); }
        return;
      }
      if (key === 'p' || key === 'escape') { if (estado === 'jugando' || estado === 'pausa') { e.preventDefault(); pausa(); } return; }
      if (estado !== 'jugando') return;
      var id = mapa[key];
      if (id) { e.preventDefault(); if (!e.repeat) pulsar(id); return; }
      var d = parseInt(key, 10);
      if (d >= 1 && d <= 9) {
        if (herr && d <= herr.length) elegirHerr(herr[d - 1].id);
        if (J.alPulsar) J.alPulsar(String(d), api);
      }
    });
    window.addEventListener('keyup', function (e) {
      var id = mapa[e.key.toLowerCase()];
      if (id) teclas[id] = false;
    });
    window.addEventListener('blur', soltar);
    lienzo.addEventListener('pointerdown', function (e) {
      if (estado !== 'jugando' || !J.alPuntero) return;
      var r = lienzo.getBoundingClientRect();
      J.alPuntero((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H, api);
    });
    function botonTactil(id, etiqueta, aria) {
      var b = el('button', null, etiqueta);
      b.type = 'button'; b.setAttribute('aria-label', aria || etiqueta);
      function baja(e) { e.preventDefault(); b.classList.add('pulsado'); pulsar(id); }
      function sube(e) { e.preventDefault(); b.classList.remove('pulsado'); if (id in teclas) teclas[id] = false; }
      b.addEventListener('pointerdown', baja);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, sube); });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      return b;
    }
    (function montarTactil() {
      var cr = $('cruceta'), ac = $('acciones');
      if (dirs.length) {
        var pos = { arriba: [2, 1, '▲', 'Arriba'], izq: [1, 2, '◀', 'Izquierda'], der: [3, 2, '▶', 'Derecha'], abajo: [2, 3, '▼', 'Abajo'] };
        var soloLR = dirs.indexOf('arriba') < 0 && dirs.indexOf('abajo') < 0;
        if (soloLR) { cr.style.gridTemplateRows = '56px'; cr.style.gridTemplateColumns = 'repeat(2,64px)'; }
        dirs.forEach(function (dd) {
          var p = pos[dd], b = botonTactil(dd, p[2], p[3]);
          if (!soloLR) { b.style.gridColumn = p[0]; b.style.gridRow = p[1]; }
          cr.appendChild(b);
        });
      }
      acciones.forEach(function (a) { ac.appendChild(botonTactil(a.id, a.etiqueta)); });
    })();

    /* --- Barra de herramientas del juego --- */
    function pintarHerr() {
      var c = $('herramientas'); c.innerHTML = '';
      if (!herr) return;
      herr.forEach(function (h, i) {
        var b = el('button', null, (i + 1) + ' · ' + (h.icono ? h.icono + ' ' : '') + h.etiqueta);
        b.type = 'button'; b.setAttribute('aria-pressed', String(h.id === herrSel));
        b.addEventListener('click', function () { if (estado === 'jugando') elegirHerr(h.id); b.blur(); });
        c.appendChild(b);
      });
    }
    function elegirHerr(id, silencioso) {
      if (!herr) return;
      herrSel = id; pintarHerr();
      if (alHerr && !silencioso) alHerr(id, api);
    }

    /* --- Paneles --- */
    function abrirPanel() { capa.hidden = false; panel.scrollTop = 0; }
    function cerrarPanel() { capa.hidden = true; panel.innerHTML = ''; botonesModal = null; }
    function parrafos(dest, txt) {
      String(txt).split('\n').forEach(function (p) { if (p.trim()) dest.appendChild(el('p', null, p)); });
    }
    function modal(cfg, g) {
      return new Promise(function (res) {
        soltar(); estado = 'modal';
        var abierto = performance.now(), ta = null;
        panel.innerHTML = '';
        if (cfg.titulo) panel.appendChild(el('h2', null, cfg.titulo));
        if (cfg.texto) parrafos(panel, cfg.texto);
        if (cfg.html) { var d = el('div'); d.innerHTML = cfg.html; panel.appendChild(d); }
        if (cfg.campo) {
          var lb = el('label', null, cfg.campo); lb.htmlFor = 'campoModal';
          ta = el('textarea'); ta.id = 'campoModal'; ta.maxLength = 300;
          panel.appendChild(lb); panel.appendChild(ta);
        }
        var cont = el('div', 'opciones' + (cfg.enFila ? ' fila' : ''));
        botonesModal = [];
        (cfg.opciones || ['Continuar']).forEach(function (o, i) {
          var b = el('button'); b.type = 'button';
          var et = typeof o === 'string' ? o : o.etiqueta;
          b.appendChild(document.createTextNode((cfg.opciones && cfg.opciones.length > 1 && !cfg.enFila ? (i + 1) + ' · ' : '') + et));
          if (o.detalle) b.appendChild(el('small', null, o.detalle));
          b.addEventListener('click', function () {

  }
  function crearFinal(api) {
    var f = { esFinal: true, txt: ['gamificación', '= premios'], x: 70, y: 260, w: 220, h: 48, vivo: true, tiembla: -9, pistaT: -9,
      sellos: { objetivos: false, feedback: false } };
    var b = S.bola;
    if (!b.pegada && Math.abs(b.x - 180) < f.w / 2 + R + 6 && Math.abs(b.y - (f.y + 24)) < f.h / 2 + R + 6) return;  /* espera a que la pelota salga de la zona */
    S.final = f; api.sonido('golpe');
    api.mensaje('¡Aparece el bloque final!', 2500);
    S.banda = { tipo: 'Bloque final', txt: '«Gamificación = premios» solo cae con dos mejoras distintas, un golpe con cada una: observa sus dos sellos.' };
  }

  function perderBola(api) {
    S.vidas--; S.bolasPerdidas++; api.sonido('golpe');
    S.bola.pegada = true; S.sinPala = 0;
    if (S.vidas > 0) { api.mensaje('Pelota perdida: elige con calma y vuelve a lanzar.', 2500); return; }
    S.activa = false; S.reintentos++;
    api.elegir({
      titulo: 'Te has quedado sin pelotas',
      texto: 'No pasa nada: los ' + S.rotos + ' fallos que ya has reparado siguen reparados y recuperas las tres vidas.',
      opciones: [{ etiqueta: 'Reintentar' }, { etiqueta: 'Reintentar en modo tranquilo', detalle: 'Pelota más lenta y pala más ancha.' }]
    }).then(function (r) {
      if (r.i === 1) api.activarTranquilo();
      S.vidas = 3; S.bola.pegada = true; S.meta = null; S.activa = true;
    });
  }

  function cierre(api) {
    /* Tres errores reparados, procurando que sean de categorías distintas */
    var tres = [], vistas = {};
    S.reparados.forEach(function (r) { if (tres.length < 3 && !vistas[r.b.cat]) { vistas[r.b.cat] = 1; tres.push(r); } });
    S.reparados.forEach(function (r) { if (tres.length < 3 && tres.indexOf(r) < 0) tres.push(r); });
    var html = '<h3>Tres errores frecuentes que detectaste y su reparación</h3><ol>', ficha = ['Tres errores detectados y su reparación:'];
    tres.forEach(function (r) {
      html += '<li><b>«' + A.esc(nombre(r.b)) + '»</b> (' + A.esc(M[r.b.cat].cat) + ') → <b>' + A.esc(M[r.h].etiqueta) + '</b>: ' + A.esc(r.frase) + '</li>';
      ficha.push('«' + nombre(r.b) + '» → ' + M[r.h].etiqueta + ': ' + r.frase);
    });
    html += '</ol><p><b>Bloque final:</b> «gamificación = premios» cayó al combinar propósito (conectar con objetivos) y feedback procesable.</p>' +
      '<p class="nota">Son casos de juego simplificados: en un aula real la reparación depende del contexto, del alumnado y de cómo se evalúa.</p>';
    var mas = null;
    MEJORAS.forEach(function (m) { if (S.usos[m.id] && (!mas || S.usos[m.id] > S.usos[mas.id])) mas = m; });
    var dobles = S.reparados.filter(function (r) { return Object.keys(r.b.ok).length > 1; }).length;
    api.registrar('Golpes con una mejora que no encajaba: ' + S.fallos + ' (cada uno devolvió una pista, sin penalización).');
    S.puntos += S.vidas * 50;
    api.terminar({
      titulo: '¡Mal diseño desmontado!', puntos: S.puntos, html: html, ficha: ficha,
      feedback: 'En esta partida reparaste ' + S.rotos + ' de 12 fallos y el bloque final. ' +
        (mas ? 'La mejora con la que más golpeaste fue «' + mas.etiqueta + '»; es un dato de esta partida, no una preferencia tuya. ' : '') +
        (S.fallos ? 'Probaste ' + S.fallos + ' veces una mejora que no encajaba y usaste las pistas para corregir: así funciona el feedback procesable. '
          : 'No necesitaste pistas esta vez. ') +
        (dobles ? dobles + ' de los fallos que reparaste admitían dos soluciones: rara vez hay una única receta. ' : '') +
        (S.reintentos ? 'Reintentaste ' + S.reintentos + ' vez/veces sin perder lo avanzado.' : '')
    });
  }

  /* ---------- Dibujo ---------- */
  function icono(ctx, cat, x, y, c) {
    ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 2;
    if (cat === 'objetivos') {            /* diana */
      ctx.strokeRect(x - 7, y - 7, 14, 14); ctx.fillRect(x - 3, y - 3, 6, 6);
    } else if (cat === 'opciones') {      /* dos flechas opuestas */
      ctx.fillRect(x - 7, y - 5, 10, 3);
      ctx.beginPath(); ctx.moveTo(x + 3, y - 8); ctx.lineTo(x + 8, y - 3.5); ctx.lineTo(x + 3, y + 1); ctx.fill();
      ctx.fillRect(x - 3, y + 3, 10, 3);
      ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.lineTo(x - 8, y + 4.5); ctx.lineTo(x - 3, y + 9); ctx.fill();
    } else if (cat === 'feedback') {      /* bocadillo */
      ctx.fillRect(x - 8, y - 7, 16, 11);
      ctx.beginPath(); ctx.moveTo(x - 5, y + 3); ctx.lineTo(x - 5, y + 9); ctx.lineTo(x + 1, y + 3); ctx.fill();
    } else {                              /* escalones */
      ctx.fillRect(x - 8, y + 3, 5, 5); ctx.fillRect(x - 2.5, y - 2, 5, 10); ctx.fillRect(x + 3, y - 7, 5, 15);
    }
  }
  function dibBloque(ctx, q, api) {
    var dx = api.t - q.tiembla < 0.3 ? (Math.floor((api.t - q.tiembla) * 20) % 2 ? 2 : -2) : 0;
    var x = q.x + dx, col = M[q.cat].color, largo = Math.max(q.txt[0].length, q.txt[1].length);
    A.caja(ctx, x, q.y, q.w, q.h, '#18203c', col, 2);
    ctx.fillStyle = col; ctx.fillRect(x, q.y, FRANJA, q.h);
    icono(ctx, q.cat, x + FRANJA / 2, q.y + q.h / 2, C.noche);
    var tx = x + FRANJA + (q.w - FRANJA) / 2, tam = largo > 10 ? 12 : 13;
    A.texto(ctx, q.txt[0], tx, q.y + 14, { tam: tam, negrita: true });
    A.texto(ctx, q.txt[1], tx, q.y + 31, { tam: tam, negrita: true });
  }
  function dibFinal(ctx, q, api) {
    var dx = api.t - q.tiembla < 0.3 ? (Math.floor((api.t - q.tiembla) * 20) % 2 ? 2 : -2) : 0, x = q.x + dx;
    A.caja(ctx, x, q.y, q.w, q.h, '#3a2f10', C.oro, 3);
    A.texto(ctx, q.txt[0], x + 78, q.y + 15, { tam: 14, negrita: true, color: C.oro });
    A.texto(ctx, q.txt[1], x + 78, q.y + 33, { tam: 14, negrita: true, color: C.oro });
    ['objetivos', 'feedback'].forEach(function (id, i) {
      var sx = x + q.w - 62 + i * 30, sy = q.y + 11, hecho = q.sellos[id];
      A.caja(ctx, sx, sy, 26, 26, hecho ? M[id].color : C.noche, hecho ? C.blanco : M[id].color, 2);
      icono(ctx, id, sx + 13, sy + 13, hecho ? C.noche : M[id].color);
      if (hecho) {                        /* marca de hecho, además del relleno */
        ctx.strokeStyle = C.blanco; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx + 14, sy + 24); ctx.lineTo(sx + 19, sy + 29); ctx.lineTo(sx + 28, sy + 17); ctx.stroke();
      }
    });
  }

  A.crear({
    numero: '07', titulo: 'Rompe el mal diseño', pluma: 'PLUMA-REDISENO',
    ancho: W, alto: H,
    objetivo: 'Reconocer fallos frecuentes de una gamificación (propósito, inclusión, retroalimentación y equilibrio del reto) y decidir qué mejora de diseño repara cada uno.',
    instrucciones: [
      'Mueve la pala para que la pelota no caiga y lánzala contra los 12 bloques: cada uno es un fallo de diseño.',
      'Antes de cada golpe elige una de las cuatro mejoras: la adecuada rompe el bloque; la que no encaja rebota y te da una pista.',
      'Repara 8 fallos para que aparezca el bloque final «gamificación = premios», que solo cae combinando dos mejoras.'
    ],
    teclas: 'Teclado: flechas o A/D mueven la pala, Espacio lanza la pelota y 1–4 eligen mejora. En móvil: botones ◀ ▶ y «Lanzar», barra de mejoras, o toca el lienzo para llevar la pala a ese punto.',
    transferencia: '¿Qué cambiarías primero en un sistema de insignias que aumenta la participación, pero no mejora el aprendizaje?',
    ayuda: AYUDA_BASE,
    controles: { cruceta: ['izq', 'der'], acciones: [{ id: 'lanzar', etiqueta: 'Lanzar' }] },
    depurar: function () { return S; },

    iniciar: function (api) {
      montar();
      api.herramientas(MEJORAS.map(function (m) { return { id: m.id, etiqueta: m.etiqueta, icono: m.icono }; }), function (id, a) {
        a.sonido('salto');
        a.flotar(M[id].corto, A.limitar(S.pala.x, 40, W - 40), PALA_Y - 22, { color: M[id].color, tam: 12, dur: 0.8 });
      });
      pintarAyuda(api);
            predecir();
    },

    alPulsar: function (id, api) {
      if (!S.activa) return;
      if ((id === 'lanzar' || id === 'arriba') && S.bola.pegada) {
        S.bola.pegada = false; direccionSaque(S.bola); S.sinPala = 0; api.sonido('salto');
      }
      if (id === 'izq' || id === 'der') S.meta = null;
    },
    alPuntero: function (x) { if (S.activa) S.meta = x; },

    actualizar: function (dt, api) {
      var i, t;
      for (i = S.trozos.length - 1; i >= 0; i--) {
        t = S.trozos[i]; t.v += dt; t.vy += 500 * dt; t.x += t.vx * dt; t.y += t.vy * dt;
        if (t.v > 0.8) S.trozos.splice(i, 1);
      }
      if (!S.activa) {
        if (S.ganaT && api.t >= S.ganaT) { S.ganaT = 0; cierre(api); }
        return;
      }
      /* Pala: teclado/táctil, o deslizamiento hacia el punto tocado en el lienzo */
      var p = S.pala, pw = anchoPala(api), vp = 380 * dt, b = S.bola;
      if (api.teclas.izq) { p.x -= vp; S.mira = -1; }
      if (api.teclas.der) { p.x += vp; S.mira = 1; }
      if (S.meta != null && !api.teclas.izq && !api.teclas.der) {
        var d = S.meta - p.x;
        if (Math.abs(d) <= vp) { p.x = S.meta; S.meta = null; } else { p.x += d < 0 ? -vp : vp; S.mira = d < 0 ? -1 : 1; }
      }
      p.x = A.limitar(p.x, IZQ + pw / 2, DER - pw / 2);

      if (b.pegada) { b.x = p.x; b.y = PALA_Y - R; }
      else {
        var rest = (150 + 5 * S.rotos) * api.vel * dt, lista = vivos();
        S.sinPala += dt;
        if (S.sinPala > 10) { b.uy = Math.abs(b.uy); S.sinPala = 4; }   /* salvaguarda: nunca se queda rebotando arriba indefinidamente */
        while (rest > 0 && S.activa && !b.pegada) {
          var ds = Math.min(3, rest); rest -= ds;
          var q = avanzar(b, ds, lista);
          if (q) { golpear(q, api); lista = vivos(); }
          if (b.uy > 0 && b.y + R >= PALA_Y && b.y - R <= PALA_Y + PALA_H && Math.abs(b.x - p.x) <= pw / 2 + R) {
            var ang = A.limitar((b.x - p.x) / (pw / 2), -1, 1) * 0.96;    /* el punto de la pala decide el ángulo (máx. 55°) */
            b.ux = Math.sin(ang); b.uy = -Math.cos(ang); b.y = PALA_Y - R; S.sinPala = 0; api.sonido('salto');
          } else if (b.y - R > BANDA_Y) perderBola(api);
        }
      }
      if (S.activa && !S.final && S.rotos >= 8) crearFinal(api);
      predecir();
      var f = S.final;
      api.hud({
        Reparados: S.rotos + '/12',
        Final: f ? ((f.sellos.objetivos ? 1 : 0) + (f.sellos.feedback ? 1 : 0)) + '/2' : (S.rotos < 8 ? 'faltan ' + (8 - S.rotos) : null),
        Vidas: S.vidas, Puntos: S.puntos
      });
    },

    dibujar: function (ctx, api) {
      if (!S) return;
      var h = api.herramienta, m = h && M[h], pw = anchoPala(api), b = S.bola, p = S.pala, i;
      /* cabecera con la leyenda de categorías (icono + palabra) */
      MEJORAS.forEach(function (x, k) {
        var lx = 8 + k * 90 - (k === 3 ? 6 : 0);
        icono(ctx, x.id, lx + 8, 11, x.color);
        A.texto(ctx, x.cat, lx + 20, 12, { tam: 11, alin: 'left', color: x.color });
      });
      ctx.fillStyle = C.morado; ctx.fillRect(0, TECHO - 3, W, 3); ctx.fillRect(0, TECHO - 3, IZQ - 2, BANDA_Y); ctx.fillRect(DER + 2, TECHO - 3, W - DER - 2, BANDA_Y);
      /* trayectoria prevista y próximo bloque */
      if (S.activa) {
        ctx.fillStyle = C.gris;
        for (i = 0; i < S.ruta.length; i += 2) ctx.fillRect(S.ruta[i] - 1, S.ruta[i + 1] - 1, 2, 2);
      }
      S.bloques.forEach(function (q) { if (q.vivo) dibBloque(ctx, q, api); });
      if (S.final && S.final.vivo) dibFinal(ctx, S.final, api);
      if (S.activa && S.obj) {
        ctx.strokeStyle = C.blanco; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
        ctx.strokeRect(S.obj.x - 2, S.obj.y - 2, S.obj.w + 4, S.obj.h + 4); ctx.setLineDash([]);
      }
      S.trozos.forEach(function (t) { ctx.fillStyle = t.color; ctx.fillRect(t.x - 3, t.y - 3, 6, 6); });
      /* pala y mejora activa */
      A.caja(ctx, p.x - pw / 2, PALA_Y, pw, PALA_H, m ? m.color : C.gris, C.blanco, 2);
      if (m) {
        icono(ctx, h, p.x - pw / 2 + 13, PALA_Y + 9, C.noche);
        A.texto(ctx, m.corto, p.x + 9, PALA_Y + 10, { tam: 12, color: C.noche, negrita: true, sombra: false });
      } else A.texto(ctx, 'elige 1–4', p.x, PALA_Y + 10, { tam: 12, color: C.noche, negrita: true, sombra: false });
      /* franja fija de explicación (no tapa el juego ni caduca) */
      var bc = S.banda.tipo === 'Pista' || S.banda.tipo === 'Aviso' ? C.oro : C.menta;
      A.caja(ctx, 0, BANDA_Y, W, H - BANDA_Y, C.noche2, bc, 2);
      A.texto(ctx, S.banda.tipo + ' · ' + S.banda.txt, W / 2, BANDA_Y + (H - BANDA_Y) / 2 + 1, { tam: 12, ancho: W - 16 });
      if (b.pegada && S.activa) A.texto(ctx, 'Espacio o «Lanzar»', A.limitar(p.x, 80, W - 80), PALA_Y - 32, { tam: 12, color: C.blanco });
      /* pelota: color de la mejora y núcleo oscuro si aún no hay ninguna */
      ctx.fillStyle = C.blanco; ctx.fillRect(b.x - R, b.y - R + 2, R * 2, R * 2 - 4); ctx.fillRect(b.x - R + 2, b.y - R, R * 2 - 4, R * 2);
      ctx.fillStyle = m ? m.color : C.noche; ctx.fillRect(b.x - R + 2, b.y - R + 2, R * 2 - 4, R * 2 - 4);
    }
  });
})();

</script>
